appId: com.kevin.kevinlauncher
productName: KevinLauncher
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/hpatchz.exe
    to: hpatchz.exe
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
# Used by electron-updater: produces latest.yml + the installer blockmap so the
# app can be updated differentially (only changed byte ranges are downloaded).
# Nothing is uploaded here — publish with `--publish never` and attach the files
# to a GitHub release manually, or use `gh release create`.
publish:
  provider: github
  owner: KevinYuHere
  repo: KevinLauncher
win:
  icon: resources/icon.ico
  # Signing/resource-editing needs the winCodeSign tool (network download).
  # We set the exe icon afterwards with the locally cached rcedit instead.
  signAndEditExecutable: false
  target:
    - nsis
  # Launcher runs elevated so game clients can be launched/tracked without
  # repeated UAC prompts.
  requestedExecutionLevel: requireAdministrator
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  # Let the user choose the install directory; the Start Menu (and desktop)
  # shortcuts are always created without asking.
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  shortcutName: KevinLauncher
  uninstallDisplayName: KevinLauncher
  artifactName: ${productName}-Setup-${version}.${ext}
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  # Dark branding art generated by scripts/gen-installer-art.ps1.
  installerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  include: build/installer.nsh
