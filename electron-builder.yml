appId: com.kevin.kevinlauncher
productName: KevinLauncher
directories:
  output: release
  buildResources: build
# The packaged app is a tiny, version-independent entry point (shell/) plus a
# versioned application directory (resources/app-<version>/, provided as
# extraResources below). An update writes a new version directory while the app
# is running and only flips resources/app-version.txt — see docs/INSTALLER.md.
# asar is disabled so the entry point is plain files under resources/app/.
asar: false
files:
  - from: shell
    to: .
# Writes resources/app-version.txt (and validates the layout below).
afterPack: scripts/afterPack.js
extraResources:
  - from: resources/hpatchz.exe
    to: hpatchz.exe
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  # The actual application code, one directory per version.
  - from: out
    to: app-${version}/out
  - from: package.json
    to: app-${version}/package.json
# Used by electron-updater-style tooling and to publish latest.yml + a blockmap.
# Nothing is uploaded here — use scripts/release.ps1.
publish:
  provider: github
  owner: KevinYuHere
  repo: KevinLauncher
win:
  icon: resources/icon.ico
  # Signing/resource-editing needs the winCodeSign tool (network download).
  # scripts/release.ps1 sets the exe icon with the locally cached rcedit instead.
  signAndEditExecutable: false
  target:
    - nsis
  # Launcher runs elevated so game clients can be launched/tracked without
  # repeated UAC prompts.
  requestedExecutionLevel: requireAdministrator
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  # Let the user choose the install directory; the Start Menu (and desktop)
  # shortcuts are always created without asking.
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  shortcutName: KevinLauncher
  uninstallDisplayName: KevinLauncher
  artifactName: ${productName}-Setup-${version}.${ext}
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  # Dark branding art generated by scripts/gen-installer-art.ps1.
  installerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  include: build/installer.nsh
