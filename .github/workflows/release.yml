name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      source-run-id:
        description: 原始正式标签 push 的 Actions 运行 ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: official-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Bind this tag to reviewed source and passing CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-source.mjs gate release-source.json
      - name: Check that this tag has one candidate batch
        id: batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-batch.mjs new release-source.json
      - name: Build from npm lock
        if: steps.batch.outputs.reused != 'true'
        run: npm ci --no-audit --no-fund
      - name: Build official installer and update assets
        if: steps.batch.outputs.reused != 'true'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-official-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath release-source.json -Destination release/release-source.json -ErrorAction Stop
      - name: Verify the exact installer and payload on isolated Windows
        if: steps.batch.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-windows-release.mjs release release-source.json
      - name: Freeze the verified official batch
        if: steps.batch.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          path: |
            release/KevinLauncher-Installer-${{ steps.source.outputs.version }}.exe
            release/KevinLauncher-${{ steps.source.outputs.version }}-app.zip
            release/update-manifest.json
            release/RELEASE_NOTES.md
            release/release-source.json
            release/windows-verification.json

  publish:
    needs: candidate
    if: |
      !cancelled() &&
      (needs.candidate.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Recheck current label, review, and CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-source.mjs gate release-source.json
      - name: Find original verified batch
        id: batch
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_SOURCE_RUN: ${{ inputs.source-run-id }}
        run: node scripts/release-batch.mjs select release-source.json
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.batch.outputs.artifactId }}
          run-id: ${{ steps.batch.outputs.runId }}
          github-token: ${{ github.token }}
          path: frozen-release
      - name: Publish verified bytes without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ steps.batch.outputs.runId }}
          RELEASE_ARTIFACT_ID: ${{ steps.batch.outputs.artifactId }}
          RELEASE_ARTIFACT_DIGEST: ${{ steps.batch.outputs.artifactDigest }}
        run: node scripts/release-batch.mjs publish release-source.json frozen-release
